<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Mahasiswa</title>
  </head>
  <body>
    <header>
      <h1>Portal Mahasiswa</h1>
    </header>

    <nav>
      <a href="index.html">Beranda</a> |
      <a href="biodata.html">Biodata</a>
    </nav>

    <main>
      <section>
        <h2>HTML LANJUTAN</h2>
        <p>
          praktikum kedua membahas banyak fitur html dengan fokus utama
          <b>video</b> dan <b>audio</b>
        </p>
      </section>

      <section id="multimedia">
        <h2>Media Audio dan Video</h2>

        <article>
          <h3>Contoh Audio</h3>
          <!-- Mengambil file suara.mp3 dari folder media -->
          <audio controls>
            <source src="media/file_example_MP3_700KB.mp3" type="audio/mpeg" />
            Browser Anda tidak mendukung elemen audio.
          </audio>
        </article>

        <br />

        <article>
          <h3>Contoh Video</h3>
          <!-- Mengambil file video.mp4 dari folder media -->
          <video width="400" controls>
            <source src="media/file_example_MP4_640_3MG.mp4" type="video/mp4" />
            Browser Anda tidak mendukung elemen video.
          </video>
        </article>
      </section>
    </main>
  </body>
</html>
